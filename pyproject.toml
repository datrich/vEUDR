[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veudr"
version = "0.9.0"
description = "Verifying EUDR deforestation-free claims: facts from satellite evidence, Article 2 applied by code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "scipy"]

[project.optional-dependencies]
geo = ["geopandas"]
examples = ["matplotlib", "pillow", "geopandas"]
test = ["pytest"]

[tool.setuptools]
packages = ["veudr"]
